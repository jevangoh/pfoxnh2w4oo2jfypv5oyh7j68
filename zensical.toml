[project]
site_name = "pfoxnh2w4oo2jfypv5oyh7j68"
site_url = "https://pfoxnh2w4oo2jfypv5oyh7j68.readthedocs.io/en/latest/"
site_description = ""
site_author = "Jevan Goh"

docs_dir = "documentation"
language = "en"

repo_url = "https://github.com/jevangoh/pfoxnh2w4oo2jfypv5oyh7j68"
edit_uri = "tree/main/pfoxnh2w4oo2jfypv5oyh7j68/"

extra_css = [
    "stylesheets/dark.css",
    "stylesheets/light.css"
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.gfm_admonition]

# --- Theme ---
[project.theme]
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.action.view"
]

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

